<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10479F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HyperTech" />
  <title>HyperTech</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    :root {
      --blue: #10479F;
      --red: #EE483D;
      --navy: #071427;
      --embed-bar-height: 74px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--navy);
      overscroll-behavior: none;
    }

    /*
      Streamlit's embedded frame can render its own "Built with Streamlit /
      Fullscreen" chrome at the bottom. Because that UI is cross-origin,
      outer-page CSS cannot target it directly. Instead the iframe is made
      taller than the visible viewport and clipped by this shell.
    */
    #streamlit-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f7f9fc;
    }

    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + var(--embed-bar-height));
      border: 0;
      display: block;
      background: #f7f9fc;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 20%, rgba(16,71,159,.36), transparent 34%),
        radial-gradient(circle at 75% 80%, rgba(238,72,61,.22), transparent 30%),
        var(--navy);
      transition: opacity .35s ease, visibility .35s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      text-align: center;
      color: white;
      padding: 24px;
    }

    .logo {
      width: 118px;
      height: 118px;
      border-radius: 28px;
      background: white;
      padding: 13px;
      box-shadow:
        0 0 0 2px rgba(255,255,255,.08),
        0 0 38px rgba(16,71,159,.48),
        0 0 30px rgba(238,72,61,.22);
      animation: float 2.4s ease-in-out infinite;
    }

    .title {
      margin-top: 18px;
      font: 800 28px/1.1 Arial, sans-serif;
      letter-spacing: .06em;
    }

    .sub {
      margin-top: 6px;
      font: 600 12px/1.2 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.68);
    }

    .loader {
      width: 42px;
      height: 4px;
      margin: 22px auto 0;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.12);
    }

    .loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--blue), var(--red));
      animation: load 1s ease-in-out infinite alternate;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes load {
      from { transform: translateX(-10%); }
      to { transform: translateX(125%); }
    }

    /* Slightly more crop on narrow Android screens where the embed bar is taller. */
    @media (max-width: 700px) {
      :root { --embed-bar-height: 82px; }
    }
  </style>
</head>

<body>
  <div id="streamlit-shell">
    <iframe
      id="app"
      title="HyperTech Business Manager"
      src="https://hypertech.streamlit.app/?embed=true&embed_options=hide_loading_screen"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>

  <div id="splash">
    <div class="card">
      <img class="logo" src="icon-512.png" alt="HyperTech logo" />
      <div class="title">HYPERTECH</div>
      <div class="sub">Business Manager</div>
      <div class="loader"></div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }

    const app = document.getElementById("app");
    const splash = document.getElementById("splash");

    app.addEventListener("load", () => {
      setTimeout(() => splash.classList.add("hide"), 450);
    });

    setTimeout(() => splash.classList.add("hide"), 7000);
  </script>
</body>
</html>
