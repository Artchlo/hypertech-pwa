<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#10479F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HyperTech" />
<title>HyperTech</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
:root{--blue:#10479F;--red:#EE483D;--navy:#071427}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--navy);font-family:Arial,Helvetica,sans-serif}#appShell{position:fixed;inset:0;overflow:hidden;background:#F8FAFD}#app{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}#streamlitChromeMask{position:absolute;left:0;right:0;bottom:0;height:48px;z-index:6;background:#F8FAFD;pointer-events:auto}#splash{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(16,71,159,.35),transparent 35%),radial-gradient(circle at 70% 80%,rgba(238,72,61,.20),transparent 30%),var(--navy);transition:opacity .35s ease,visibility .35s ease}#splash.hide{opacity:0;visibility:hidden}.splash-card{text-align:center;color:#fff;padding:24px}.splash-logo{width:120px;height:120px;border-radius:28px;background:#fff;padding:14px;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 0 38px rgba(16,71,159,.45),0 0 28px rgba(238,72,61,.22);animation:float 2.4s ease-in-out infinite}.splash-title{margin-top:18px;font-size:28px;font-weight:800;letter-spacing:.04em}.splash-sub{margin-top:5px;color:rgba(255,255,255,.68);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.loader{width:40px;height:4px;margin:22px auto 0;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.12)}.loader:after{content:"";display:block;width:45%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--red));animation:load 1s ease-in-out infinite alternate}#installBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;padding:12px 18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),#1d63d5);box-shadow:0 10px 28px rgba(16,71,159,.35);cursor:pointer;display:none}@media(display-mode:standalone){#installBtn{display:none!important}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes load{from{transform:translateX(-10%)}to{transform:translateX(125%)}}
</style></head>
<body>
<div id="splash"><div class="splash-card"><img class="splash-logo" src="icon-512.png" alt="HyperTech logo"/><div class="splash-title">HYPERTECH</div><div class="splash-sub">Business Manager</div><div class="loader"></div></div></div>
<div id="appShell"><iframe id="app" title="HyperTech Business Manager" src="https://hypertech.streamlit.app/?embed=true&embed_options=hide_loading_screen" allow="clipboard-read; clipboard-write"></iframe><div id="streamlitChromeMask" aria-hidden="true"></div></div>
<button id="installBtn">Install HyperTech</button>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))}
const frame=document.getElementById('app'),splash=document.getElementById('splash');frame.addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),450));setTimeout(()=>splash.classList.add('hide'),7000);
let installPrompt=null;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.style.display='block'});installBtn.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.style.display='none'});window.addEventListener('appinstalled',()=>installBtn.style.display='none');
</script></body></html>
